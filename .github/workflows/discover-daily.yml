name: discover-daily

on:
  schedule:
    - cron: "17 6 * * *"   # 06:17 UTC. Off-peak minute + early hour to reduce cron delay.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --bin discover

      - name: Run discover
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: ./target/debug/discover

      - name: Commit proposed cache
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cache/proposed.yml
          if git diff --staged --quiet; then
            echo "No changes."
          else
            git commit -m "discover: $(date -u +%F) proposal"
            git push
          fi
